<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PelletPirate</title>
<style>
body{background:#000;color:#eee;font-family:system-ui,-apple-system,sans-serif;text-align:center;margin:0;padding:14px;-webkit-user-select:none;user-select:none}
h1{color:#FF6B35;font-size:1.15rem;letter-spacing:3px;margin:0 0 10px}
.alarm{display:none;background:#FF4444;color:#fff;font-weight:700;padding:12px 8px;border-radius:8px;margin:0 0 12px;font-size:1rem}
.alarm .hint{font-weight:400;font-size:.75rem;opacity:.85}
.lbl{color:#888;font-size:.78rem;letter-spacing:2px}
.cur{font-size:4rem;font-weight:700;margin:.05em 0;line-height:1}
.tgt-row{display:flex;align-items:center;justify-content:center;gap:14px;margin:.1em 0 .3em}
.tgt{color:#FF6B35;font-size:1.9rem;font-weight:600;min-width:112px;cursor:pointer}
input.tin{background:#111;color:#FF6B35;border:2px solid #FF6B35;border-radius:8px;font-size:1.4rem;font-weight:600;width:96px;text-align:center;padding:4px}
button{background:#000;color:#fff;border:2px solid #FF6B35;border-radius:8px;font-size:1.2rem;font-weight:600;min-width:56px;height:50px;touch-action:manipulation}
button:active{background:#FF6B35}
button.sm{font-size:.82rem;height:38px;min-width:48px;border-color:#555;color:#aaa}
button.chip{font-size:.8rem;height:42px;min-width:60px;border-color:#555;color:#ccc;border-radius:20px}
button.chip.on{border-color:#00D4AA;color:#00D4AA;font-weight:700}
button.chip.dim{opacity:.3}
button.go{background:#FF6B35;color:#000;font-size:1.1rem;min-width:170px}
button.warn{border-color:#FF4444;color:#FF4444}
.mode{color:#00D4AA;font-size:.95rem;margin:6px 0 4px}
.off{color:#555}
.et{color:#888;font-size:.85rem;min-height:1.1em}
.acts{display:flex;justify-content:center;gap:18px;margin:8px 0 12px}
.act{font-size:.78rem;letter-spacing:1px;color:#333;border:1px solid #333;border-radius:14px;padding:5px 12px}
.act.on{color:#000;font-weight:700}
#af.on{background:#44FF44;border-color:#44FF44}
#aa.on{background:#FFCC00;border-color:#FFCC00}
#ai.on{background:#FF4444;border-color:#FF4444}
.modes{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:10px 0 14px}
.probes{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px;margin:0 auto}
.card{border:1px solid #333;border-radius:10px;padding:8px 6px}
.card .nm{color:#888;font-size:.72rem;letter-spacing:1px;min-height:1em}
.card .pt{font-size:1.6rem;font-weight:700;margin:2px 0}
.card .inf{color:#555;font-size:.72rem;min-height:2.2em;line-height:1.5}
.card .inf .g{color:#44FF44}
.card .inf .r{color:#FF4444}
.card.dis .pt{color:#444}
.card .prow{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:5px}
.link{color:#555;font-size:.72rem;margin-top:16px}
#editor{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:10;padding:26px 18px;overflow-y:auto}
#editor h2{color:#FF6B35;font-size:1.05rem;letter-spacing:2px;margin:0 0 18px}
.erow{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px 0}
.eval{color:#FF6B35;font-size:1.6rem;font-weight:600;min-width:96px;cursor:pointer}
select{background:#111;color:#eee;border:2px solid #555;border-radius:8px;font-size:1.05rem;padding:10px;width:230px;margin:6px 0}
.ebtns{display:flex;justify-content:center;gap:14px;margin-top:22px}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:20}
.mbox{background:#111;border:2px solid #FF6B35;border-radius:12px;max-width:300px;margin:34vh auto 0;padding:22px 18px}
.mbox .mtxt{font-size:1.05rem;line-height:1.45}
.mbox .msub{color:#888;font-size:.85rem;margin-top:6px}
</style>
</head>
<body>
<h1>PELLETPIRATE</h1>
<div class="alarm" id="alarm" onclick="ackAlarm()">
  <span id="altxt"></span><br><span class="hint">tap to silence</span>
</div>
<div class="lbl">CURRENT</div>
<div class="cur" id="gt">--</div>
<div class="lbl">TARGET</div>
<div class="tgt-row">
  <button id="dn">&minus;5</button>
  <div class="tgt" id="tgt">--</div>
  <button id="up">+5</button>
</div>
<div class="mode off" id="mode">connecting&hellip;</div>
<div class="et" id="et"></div>
<div class="acts">
  <div class="act" id="af">FAN</div>
  <div class="act" id="aa">AUGER</div>
  <div class="act" id="ai">IGNITER</div>
</div>
<div class="modes" id="modes"></div>
<div class="lbl">PROBES &middot; tap a probe to set up</div>
<div class="probes" id="probes"></div>
<div class="lbl" style="margin-top:18px">COOK PROFILES</div>
<div style="margin:8px 0"><button class="sm" style="min-width:200px;border-color:#FF6B35;color:#FF6B35" onclick="saveProfile()">SAVE CURRENT COOK</button></div>
<div id="profiles"></div>
<div class="lbl" style="margin-top:18px">COOK LOGS</div>
<div id="logs" style="margin-top:6px"></div>
<div class="lbl" style="margin-top:18px">WI-FI</div>
<div id="wifist" style="color:#888;font-size:.85rem;margin:6px 0">--</div>
<div><button class="sm" style="min-width:200px" onclick="wOpen()">CHANGE WI-FI</button></div>
<div class="link" id="link"></div>

<div id="wifiov" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:15;padding:26px 18px;overflow-y:auto">
  <h2 style="color:#FF6B35;font-size:1.05rem;letter-spacing:2px;margin:0 0 12px">CHANGE WI-FI</h2>
  <div id="wlist"></div>
  <div id="wpw" style="display:none">
    <div class="lbl" id="wssid" style="margin-top:10px"></div>
    <input id="wpass" type="text" autocomplete="off" autocapitalize="off" placeholder="password"
      style="background:#111;color:#eee;border:2px solid #555;border-radius:8px;font-size:1.05rem;padding:10px;width:230px;margin:10px 0">
    <div class="ebtns" style="margin-top:6px">
      <button style="min-width:130px" onclick="wConnect()">CONNECT</button>
    </div>
  </div>
  <div id="wmsg" style="color:#00D4AA;font-size:.9rem;margin-top:12px;line-height:1.5"></div>
  <div class="ebtns">
    <button class="sm" style="min-width:100px;height:50px" onclick="wClose()">CLOSE</button>
  </div>
</div>

<div id="editor">
  <h2 id="ehead">PROBE 1</h2>
  <div class="lbl">TARGET &middot; tap number to type</div>
  <div class="erow">
    <button onclick="eBump('tg',-5)">&minus;5</button>
    <div class="eval" id="etg" onclick="eType('tg')">OFF</div>
    <button onclick="eBump('tg',5)">+5</button>
  </div>
  <div class="lbl">MEAT</div><br>
  <select id="emeat"></select>
  <div class="lbl" style="margin-top:8px">ALARM &middot; tap number to type</div>
  <div class="erow">
    <button onclick="eBump('am',-5)">&minus;5</button>
    <div class="eval" id="eam" onclick="eType('am')">OFF</div>
    <button onclick="eBump('am',5)">+5</button>
  </div>
  <div class="lbl">ALARM ACTION</div><br>
  <select id="ealarm"></select>
  <div class="ebtns">
    <button class="sm" style="min-width:100px" onclick="eClear()">CLEAR PROBE</button>
  </div>
  <div class="ebtns">
    <button style="min-width:120px" onclick="eSave()">SAVE</button>
    <button class="sm" style="min-width:100px;height:50px" onclick="eClose()">CANCEL</button>
  </div>
</div>

<div id="modal">
  <div class="mbox">
    <div class="mtxt" id="mtxt"></div>
    <div class="msub" id="msub"></div>
    <div class="ebtns">
      <button id="mok" style="min-width:120px">OK</button>
      <button class="sm" id="mcancel" style="min-width:100px;height:50px">CANCEL</button>
    </div>
  </div>
</div>

<script>
// Keep in sync with ui_set_probes.c meat_types[] / alarm_types[]
var MEATS = ['Brisket','Beef','Chicken','Fish','Lamb','Pork Butt','Turkey','Veg (for girls)','Wild Game'];
var ALARMS = ['Baste','Custom','Secret','Turn','Wrap','Beer Me','Whiskey Shot','Margarita'];

var tgtVal = null, pending = null, ws = null, pollTimer = null, curMode = '', last = null;

(function(){
  var host = document.getElementById('probes'), html = '';
  for (var i = 0; i < 4; i++) {
    html += '<div class="card dis" id="c'+i+'" onclick="eOpen('+i+')">' +
      '<div class="nm" id="nm'+i+'">PROBE '+(i+1)+'</div>' +
      '<div class="pt" id="pt'+i+'">--</div>' +
      '<div class="inf" id="inf'+i+'"></div>' +
      '</div>';
  }
  host.innerHTML = html;
  var m = '', a = '';
  for (var j = 0; j < MEATS.length; j++) m += '<option>'+MEATS[j]+'</option>';
  for (var k = 0; k < ALARMS.length; k++) a += '<option>'+ALARMS[k]+'</option>';
  document.getElementById('emeat').innerHTML = m;
  document.getElementById('ealarm').innerHTML = a;
})();

// In-page confirm modal (replaces window.confirm) — resolves true/false
var mResolve = null;
function showConfirm(msg, sub, okLabel, danger){
  return new Promise(function(res){
    mResolve = res;
    document.getElementById('mtxt').textContent = msg;
    document.getElementById('msub').textContent = sub || '';
    var ok = document.getElementById('mok');
    ok.textContent = okLabel || 'OK';
    ok.className = danger ? 'warn' : '';
    document.getElementById('modal').style.display = 'block';
  });
}
function mDone(v){
  document.getElementById('modal').style.display = 'none';
  if (mResolve){ var r = mResolve; mResolve = null; r(v); }
}
document.getElementById('mok').onclick = function(){ mDone(true); };
document.getElementById('mcancel').onclick = function(){ mDone(false); };
document.getElementById('modal').onclick = function(e){ if (e.target === this) mDone(false); };

var TOKS = { 'smoke':'SMOKE', 'supersmoke':'SUPER', 'cook':'COOK', 'keepwarm':'WARM', 'reignite':'RE-IGN' };

function renderModes(mode){
  var host = document.getElementById('modes'), html = '';
  var active = (mode !== 'Off' && mode !== 'Ignite');
  if (mode === 'Off') {
    html += '<button class="go" onclick="setMode(\'start\')">START &middot; IGNITE</button>';
  } else if (mode === 'Ignite') {
    html += '<button class="go warn" style="background:#000;color:#FF4444" onclick="setMode(\'off\')">STOP IGNITE</button>';
  }
  for (var tok in TOKS) {
    var on = active && mode.replace(/[ -]/g,'').toLowerCase() === tok ? ' on' : '';
    var dim = active ? '' : ' dim';
    var click = active ? ' onclick="setMode(\''+tok+'\')"' : '';
    html += '<button class="chip'+on+dim+'"'+click+'>'+TOKS[tok]+'</button>';
  }
  var sdim = active ? '' : ' dim';
  var sclick = active ? ' onclick="setMode(\'shutdown\')"' : '';
  html += '<button class="chip warn'+sdim+'"'+sclick+'>SHUTDOWN</button>';
  if (mode === 'Shutdown') {
    html += '<button class="chip warn" onclick="setMode(\'off\')">OFF NOW</button>';
  }
  host.innerHTML = html;
}

var lastPv = null;

function render(s){
  last = s;
  // Profile list changed (LCD or web save/delete) — re-fetch it
  if (s.pv !== undefined && s.pv !== lastPv) { lastPv = s.pv; loadProfiles(); }
  document.getElementById('wifist').textContent =
    s.ssid ? s.ssid + '  (' + s.rssi + ' dBm)' : 'not connected';
  document.getElementById('gt').textContent = Math.round(s.gt) + '°F';
  if (!pending && !typing) {
    tgtVal = s.tgt;
    document.getElementById('tgt').textContent = s.tgt + '°F';
  }
  var m = document.getElementById('mode');
  m.textContent = 'Mode: ' + s.mode;
  m.className = 'mode' + (s.mode === 'Off' ? ' off' : '');
  if (s.mode !== curMode) { curMode = s.mode; renderModes(s.mode); }

  document.getElementById('et').textContent =
    (s.mode !== 'Off' && s.et > 0)
      ? 'ET ' + Math.floor(s.et/60) + ':' + ('0'+(s.et%60)).slice(-2) : '';

  document.getElementById('af').className = 'act' + (s.f ? ' on' : '');
  document.getElementById('aa').className = 'act' + (s.a ? ' on' : '');
  document.getElementById('ai').className = 'act' + (s.ig ? ' on' : '');

  var ab = document.getElementById('alarm');
  if (s.al) {
    document.getElementById('altxt').textContent = s.alt;
    ab.style.display = 'block';
  } else {
    ab.style.display = 'none';
  }

  if (s.p) for (var i = 0; i < 4; i++) {
    var p = s.p[i];
    document.getElementById('c'+i).className = 'card' + (p.en ? '' : ' dis');
    document.getElementById('nm'+i).textContent =
      'PROBE ' + (i+1) + (p.fd ? ' · ' + p.fd.toUpperCase() : '');
    document.getElementById('pt'+i).textContent =
      (p.en && p.t > 0) ? Math.round(p.t) + '°' : '--';
    var inf = '';
    if (p.en) {
      inf = '<span class="g">goal ' + p.tg + '°</span>';
      if (p.am > 0) inf += ' · <span class="r">' + p.am + '° ' + (p.at || 'alarm') + '</span>';
      if (p.es >= 0) inf += '<br>~' + p.es + ' min';
    } else {
      inf = 'not set';
    }
    document.getElementById('inf'+i).innerHTML = inf;
  }
}

async function poll(){
  try{
    var r = await fetch('/api/status');
    render(await r.json());
  }catch(e){}
}

function connectWS(){
  ws = new WebSocket('ws://' + location.host + '/ws');
  ws.onopen = function(){
    document.getElementById('link').textContent = 'live';
    if (pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  };
  ws.onmessage = function(e){ render(JSON.parse(e.data)); };
  ws.onclose = function(){
    document.getElementById('link').textContent = 'reconnecting…';
    if (!pollTimer) pollTimer = setInterval(poll, 3000);
    setTimeout(connectWS, 3000);
  };
}

function bump(delta){
  if (tgtVal === null) return;
  tgtVal = Math.min(499, Math.max(100, tgtVal + delta));
  document.getElementById('tgt').textContent = tgtVal + '°F';
  if (pending) clearTimeout(pending);
  pending = setTimeout(async function(){
    try{ await fetch('/api/grill-target', { method:'POST', body:'' + tgtVal }); }
    catch(e){}
    pending = null;
  }, 600);
}
document.getElementById('up').onclick = function(){ bump(5); };
document.getElementById('dn').onclick = function(){ bump(-5); };

var typing = false;
document.getElementById('tgt').onclick = function(){
  if (tgtVal === null || typing) return;
  typing = true;
  var host = document.getElementById('tgt');
  host.innerHTML = '<input class="tin" type="number" inputmode="numeric" min="100" max="499" value="' + tgtVal + '">';
  var inp = host.firstChild;
  inp.focus(); inp.select();
  inp.onblur = async function(){
    var v = parseInt(inp.value, 10);
    if (!isNaN(v)) tgtVal = Math.min(499, Math.max(100, v));
    host.textContent = tgtVal + '°F';
    typing = false;
    try{ await fetch('/api/grill-target', { method:'POST', body: '' + tgtVal }); }
    catch(e){}
  };
  inp.onkeydown = function(ev){ if (ev.key === 'Enter') inp.blur(); };
};

async function setMode(tok){
  if (tok === 'start' && !await showConfirm('Start ignition?', 'Fan, auger and igniter will fire', 'IGNITE')) return;
  if (tok === 'shutdown' && !await showConfirm('Start shutdown burn-off?', '', 'SHUTDOWN', true)) return;
  try{ await fetch('/api/mode', { method:'POST', body: tok }); poll(); }
  catch(e){}
}
async function ackAlarm(){
  try{ await fetch('/api/alarm-ack', { method:'POST' }); poll(); }
  catch(e){}
}

// --- Probe editor (mirrors the LCD Set Probes wizard) ---
var eIdx = 0, eTg = 0, eAm = 0;

function eShow(){
  document.getElementById('etg').textContent = eTg > 0 ? eTg + '°' : 'OFF';
  document.getElementById('eam').textContent = eAm > 0 ? eAm + '°' : 'OFF';
}
function eOpen(i){
  if (!last || !last.p) return;
  var p = last.p[i];
  eIdx = i;
  eTg = p.en ? p.tg : 0;
  eAm = p.en ? p.am : 0;
  document.getElementById('ehead').textContent = 'PROBE ' + (i+1);
  var mi = MEATS.indexOf(p.fd); document.getElementById('emeat').selectedIndex = mi >= 0 ? mi : 0;
  var ai = ALARMS.indexOf(p.at); document.getElementById('ealarm').selectedIndex = ai >= 0 ? ai : 0;
  eShow();
  document.getElementById('editor').style.display = 'block';
}
// Tap-to-type: swap the value for a numeric input; blur/Enter commits.
// Under 100 = OFF (same rule as the LCD wizard), clamped at 499.
function eType(which){
  var host = document.getElementById(which === 'tg' ? 'etg' : 'eam');
  if (host.firstChild && host.firstChild.tagName === 'INPUT') return;
  var cur = which === 'tg' ? eTg : eAm;
  host.innerHTML = '<input class="tin" type="number" inputmode="numeric" min="0" max="499" value="' + (cur || '') + '">';
  var inp = host.firstChild;
  inp.focus(); inp.select();
  inp.onblur = function(){
    var v = parseInt(inp.value, 10);
    if (isNaN(v) || v < 100) v = 0;
    if (v > 499) v = 499;
    if (which === 'tg') eTg = v; else eAm = v;
    eShow();
  };
  inp.onkeydown = function(ev){ if (ev.key === 'Enter') inp.blur(); };
}

function eBump(which, delta){
  if (which === 'tg') {
    eTg = eTg === 0 ? (delta > 0 ? 160 : 0) : eTg + delta;
    if (eTg < 100) eTg = 0;
    if (eTg > 499) eTg = 499;
  } else {
    eAm = eAm === 0 ? (delta > 0 ? 160 : 0) : eAm + delta;
    if (eAm < 100) eAm = 0;
    if (eAm > 499) eAm = 499;
  }
  eShow();
}
function eClose(){ document.getElementById('editor').style.display = 'none'; }
function eClear(){ eTg = 0; eAm = 0; eSave(); }
async function eSave(){
  var food = eTg > 0 ? document.getElementById('emeat').value : '';
  var at = (eTg > 0 && eAm > 0) ? document.getElementById('ealarm').value : '';
  var body = (eIdx+1) + '|' + eTg + '|' + eAm + '|' + food + '|' + at;
  try{ await fetch('/api/probe-config', { method:'POST', body: body }); }
  catch(e){}
  eClose();
  poll();
}

async function loadLogs(){
  try{
    var r = await fetch('/api/log');
    var files = await r.json();
    var host = document.getElementById('logs');
    if (!files.length) { host.innerHTML = '<span style="color:#555;font-size:.8rem">no cooks logged yet</span>'; return; }
    files.sort(function(a,b){ return a.n < b.n ? 1 : -1; });
    var html = '';
    for (var i = 0; i < files.length; i++) {
      var kb = (files[i].s / 1024).toFixed(1);
      html += '<div style="margin:4px 0"><a style="color:#00D4AA;font-size:.9rem" ' +
        'href="/api/log?f=' + files[i].n + '" download="' + files[i].n + '">' +
        files[i].n + '</a> <span style="color:#555;font-size:.75rem">' + kb + ' KB</span></div>';
    }
    host.innerHTML = html;
  }catch(e){}
}

async function loadProfiles(){
  try{
    var r = await fetch('/api/profiles');
    var ps = await r.json();
    var host = document.getElementById('profiles');
    if (!ps.length) { host.innerHTML = '<span style="color:#555;font-size:.8rem">no saved cooks</span>'; return; }
    var html = '';
    for (var i = 0; i < ps.length; i++) {
      var d = ps[i].d.replace(/'/g,'');
      html += '<div style="margin:6px 0"><button class="sm" style="min-width:230px" ' +
        'onclick="loadProfile(\'' + ps[i].f + '\',\'' + d + '\')">' +
        ps[i].d + '</button> ' +
        '<button class="sm" style="color:#FF5555;border-color:#FF5555" ' +
        'onclick="delProfile(\'' + ps[i].f + '\',\'' + d + '\')">&#10005;</button></div>';
    }
    host.innerHTML = html;
  }catch(e){}
}
async function saveProfile(){
  try{ await fetch('/api/profile-save', { method:'POST' }); loadProfiles(); }
  catch(e){}
}
async function loadProfile(f, d){
  if (!await showConfirm('Load "' + d + '"?', 'Replaces the current target and probe setup', 'LOAD')) return;
  try{ await fetch('/api/profile-load', { method:'POST', body: f }); poll(); }
  catch(e){}
}
async function delProfile(f, d){
  if (!await showConfirm('Delete "' + d + '"?', 'This cannot be undone', 'DELETE', true)) return;
  try{ await fetch('/api/profile-delete', { method:'POST', body: f }); loadProfiles(); }
  catch(e){}
}

// --- WiFi setup ---
function esc(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
var wSsid = '';
function wOpen(){
  document.getElementById('wifiov').style.display = 'block';
  document.getElementById('wpw').style.display = 'none';
  document.getElementById('wmsg').textContent = '';
  wScan();
}
function wClose(){ document.getElementById('wifiov').style.display = 'none'; }
async function wScan(){
  var host = document.getElementById('wlist');
  host.innerHTML = '<span style="color:#888;font-size:.85rem">scanning…</span>';
  try{
    var r = await fetch('/api/wifi-scan');
    var ns = await r.json();
    var html = '';
    for (var i = 0; i < ns.length; i++) {
      html += '<div style="margin:6px 0"><button class="sm" style="min-width:230px" ' +
        'onclick="wPick(this.dataset.s)" data-s="' + esc(ns[i].s).replace(/"/g,'&quot;') + '">' +
        esc(ns[i].s) + ' &nbsp;<span style="color:#555">' + ns[i].r + '</span></button></div>';
    }
    html += '<div style="margin:12px 0"><button class="sm" onclick="wScan()">RESCAN</button></div>';
    host.innerHTML = html;
  }catch(e){ host.innerHTML = '<span style="color:#FF4444;font-size:.85rem">scan failed — try again</span>'; }
}
function wPick(s){
  wSsid = s;
  document.getElementById('wssid').textContent = s;
  document.getElementById('wpass').value = '';
  document.getElementById('wpw').style.display = 'block';
  document.getElementById('wpass').focus();
}
async function wConnect(){
  if (!wSsid) return;
  try{
    await fetch('/api/wifi-set', { method:'POST', body: wSsid + '\n' + document.getElementById('wpass').value });
    document.getElementById('wmsg').innerHTML = 'Sent — the grill is switching to <b>' + esc(wSsid) +
      '</b>.<br>Join that network, then revisit <b>pelletpirate.local</b> (or check the IP on the LCD Settings screen).';
    document.getElementById('wpw').style.display = 'none';
  }catch(e){
    document.getElementById('wmsg').innerHTML = '<span style="color:#FF4444">Send failed — try again</span>';
  }
}

poll();
connectWS();
loadLogs();
loadProfiles();
setInterval(loadLogs, 60000);
</script>
